[package]
name = "open-browser"
version = "0.1.0"
description = "A dedicated local browser for AI agents"
authors = ["Open Browser Team"]
edition = "2021"

[lib]
name = "open_browser_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4" }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.5", features = ["unstable"] }
tauri-plugin-log = "2"
tokio = { version = "1.38", features = ["full"] }
uuid = { version = "1.8", features = ["v4"] }
url = "2.5"
