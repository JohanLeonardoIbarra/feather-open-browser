<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'; img-src 'self' data:;" />
    <title>Open Browser · Agent Environment</title>
    <link rel="stylesheet" href="./tokens.css" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="chrome">
      <div class="masthead">
        <div class="brand" aria-label="Open Browser">
          <svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 18h5l4-6 3 3h4M4 6h6l2 3m4 9 3-3"/>
            <circle cx="4" cy="18" r="1.5"/>
            <circle cx="20" cy="15" r="1.5"/>
          </svg>
          <span>Open Browser</span>
        </div>
        <div id="spaces" class="spaces" role="tablist" aria-label="Spaces de agentes"></div>
        <span class="spacer"></span>
        <div id="agent-indicator" class="agent-indicator standby">
          <span class="indicator-dot"></span>
          <span id="agent-indicator-label">En espera</span>
        </div>
        <span id="api-status" class="api-status"><span class="api-light"></span><span>API local</span></span>
      </div>
      <div id="tabs-bar" class="tabs-row">
        <div id="tabs" class="tabs" role="tablist" aria-label="Pestañas"></div>
        <div class="url-display" id="url-display" title="URL activa del agente">
          <span class="url-lock">
            <svg viewBox="0 0 20 20" aria-hidden="true"><rect x="4" y="8" width="12" height="9" rx="2"/><path d="M7 8V5a3 3 0 0 1 6 0v3"/></svg>
          </span>
          <span id="url-text" class="url-text">about:blank</span>
        </div>
        <button id="reload" class="icon-button" type="button" title="Recargar vista" aria-label="Recargar">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M16 7a6.5 6.5 0 0 0-11.2-1.5L3 8m0-4v4h4M4 13a6.5 6.5 0 0 0 11.2 1.5L17 12m0 4v-4h-4"/></svg>
        </button>
      </div>
    </header>

    <main id="standby-view" class="standby-view">
      <div class="standby-card">
        <div class="standby-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <path d="M4 18h5l4-6 3 3h4M4 6h6l2 3m4 9 3-3"/>
            <circle cx="4" cy="18" r="1.5"/>
            <circle cx="20" cy="15" r="1.5"/>
          </svg>
        </div>
        <h2>Open Browser</h2>
        <p class="standby-subtitle">Entorno de inspección y retroalimentación para agentes</p>
        <div class="standby-badge">
          <span class="pulse-beacon"></span>
          <span>Esperando que un agente cree un Space</span>
        </div>
        <p class="standby-hint">Los agentes inician Spaces bajo demanda para probar aplicaciones, examinar cambios visuales y corregir errores.</p>
      </div>
    </main>

    <script src="./tauri-bridge.js"></script>
    <script type="module" src="./renderer.js"></script>
  </body>
</html>
